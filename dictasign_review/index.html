<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dicta-Sign pose comparison</title>
<style>
:root {color-scheme:dark; font-family:Inter,system-ui,sans-serif; color:#edf3f4; background:#101519; --border:#304047; --muted:#a7bac2; --accent:#62e1bf}
* {box-sizing:border-box}
body {margin:0}
header {border-bottom:1px solid var(--border); padding:22px clamp(16px,4vw,48px); display:flex; gap:10px 28px; align-items:baseline; justify-content:space-between; flex-wrap:wrap}
h1,h2,p {margin:0}
h1 {font-size:clamp(20px,4vw,31px); letter-spacing:-.035em}
small, .muted {color:var(--muted)}
main {padding:18px clamp(12px,2.5vw,42px); max-width:1850px; margin:auto}
.clip-browser, article {border:1px solid var(--border); background:#172024; border-radius:12px; min-width:0}
.clip-browser {padding:10px; margin-bottom:14px; display:flex; align-items:center; gap:12px}
input[type=search], button {border:1px solid var(--border); border-radius:7px; background:#101519; color:inherit; font:inherit}
input[type=search] {flex:0 1 215px; width:100%; min-width:0; padding:9px}
button {padding:7px 10px; cursor:pointer}
button:disabled {opacity:.45; cursor:default}
button[aria-current=true] {border-color:var(--accent); background:#203731}
:focus-visible {outline:2px solid var(--accent); outline-offset:1px}
#list {min-width:0; flex:1; display:flex; gap:5px; align-items:center; overflow-x:auto; padding:4px; scrollbar-width:thin}
#list button {display:flex; gap:7px; align-items:baseline; flex:none; white-space:nowrap}
#list small {font-variant-numeric:tabular-nums}
article {padding:clamp(12px,2.5vw,24px)}
.heading,.controls,.layers {display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px}
.heading,.controls {justify-content:space-between}
h2 {font-size:clamp(20px,3vw,29px); overflow-wrap:anywhere}
a {color:var(--accent); text-underline-offset:4px}
#gloss,#status {margin:6px 0 12px}
.comparison {display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px}
.comparison section {min-width:0}
[data-preview=hamer] .comparison {display:block}
[data-preview=hamer] .comparison section:not(:has(#hamer)) {display:none}
[data-preview=hamer] .comparison section:has(#hamer) {display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px 20px; align-items:start}
[data-preview=hamer] .comparison h3 {grid-column:1; grid-row:1}
[data-preview=hamer] .stage {grid-column:1; grid-row:2}
[data-preview=hamer] .model-status {grid-column:1; grid-row:3}
[data-preview=hamer] .avatar-label {grid-column:2; grid-row:1}
[data-preview=hamer] .avatar-preview {grid-column:2; grid-row:2; height:100%; min-height:240px}
@media (max-width:680px) {
  [data-preview=hamer] .comparison section:has(#hamer) {display:block}
  [data-preview=hamer] .avatar-preview {height:300px}
}
.comparison h3 {font-size:14px; margin:8px 0}
.stage {position:relative; aspect-ratio:4/3; background:#080b0d; border-radius:8px; overflow:hidden}
#video {position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
.stage canvas {display:block; width:100%; height:100%; object-fit:contain}
.model-status {color:var(--muted); font-size:12px; min-height:2.8em; margin-top:8px}
.avatar-label {color:var(--muted); font-size:12px; margin:8px 0 5px}
.avatar-preview {height:clamp(185px,20vw,300px); background:#101519; border-radius:8px; overflow:hidden; display:grid; place-items:center; text-align:center; color:var(--muted); font-size:12px}
.avatar-stage, .avatar-stage > div {width:100%; height:100%; position:relative}
.avatar-stage canvas {display:block; cursor:grab}
.avatar-loading, .avatar-view-note, .hand-tracking-note {position:absolute; left:6px; right:6px; color:#fff; background:#101519dd; border-radius:4px; padding:4px; z-index:1; pointer-events:none}
.avatar-loading, .hand-tracking-note {top:6px}
.hand-tracking-note:empty {display:none}
.avatar-view-note {bottom:6px}
#video-status {color:var(--muted); font-size:13px}
#video-status:empty {display:none}
.controls {background:#101519; border-radius:8px; padding:10px}
#seek {flex:1; min-width:70px}
#time {font-size:13px; font-variant-numeric:tabular-nums}
.layers {margin-top:16px}
.layers label {display:flex; gap:5px; align-items:center}
.layers label[hidden] {display:none}
input {accent-color:var(--accent)}
@media(max-width:1280px) {.comparison {grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:850px) {.comparison {grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px) {.clip-browser {display:block} #list {margin-top:6px}}
@media(max-width:450px) {.comparison {grid-template-columns:minmax(0,1fr)}}
</style>
<script type="module" src="/review.js?v=matignon-full-frame"></script>
</head>
<body>
<header><h1>Dicta-Sign pose comparison</h1><p id="summary" class="muted">Loading the local inventory…</p></header>
<main>
<nav class="clip-browser" aria-label="Clip browser">
<input id="search" type="search" aria-label="Filter clips by concept or gloss" placeholder="Search signs">
<div id="list"></div>
</nav>
<article aria-label="Selected clip">
<div class="heading"><h2 id="concept">Select a clip</h2><a id="source" target="_blank" rel="noreferrer" hidden>Original Dicta-Sign entry</a></div>
<p id="gloss" class="muted"></p>
<video id="video" playsinline preload="auto" aria-hidden="true"></video>
<p id="video-status" role="status"></p>
<div class="controls">
<button id="play" type="button" disabled>Play</button>
<input id="seek" type="range" min="0" max="0" value="0" step="0.001" aria-label="Video position" disabled>
<button id="step-back" type="button" aria-label="Previous video frame" disabled>−1 frame</button><button id="step-forward" type="button" aria-label="Next video frame" disabled>+1 frame</button><output id="time">0.00 / 0.00 s</output>
<div><button id="prev" type="button" disabled aria-label="Previous clip">←</button> <button id="next" type="button" disabled aria-label="Next clip">→</button></div>
</div>
<div class="comparison">
<section><h3>MediaPipe Holistic</h3><div class="stage"><canvas id="mediapipe" aria-label="MediaPipe overlay"></canvas></div><p class="model-status" id="mediapipe-status"></p></section>
<section><h3>MMPose · DWPose-t</h3><div class="stage"><canvas id="mmpose" aria-label="MMPose overlay"></canvas></div><p class="model-status" id="mmpose-status"></p></section>
<section><h3>Sapiens · 0.3B</h3><div class="stage"><canvas id="sapiens" aria-label="Sapiens overlay"></canvas></div><p class="model-status" id="sapiens-status"></p></section>
<section><h3>SDPose · Wholebody</h3><div class="stage"><canvas id="sdpose" aria-label="SDPose overlay"></canvas></div><p class="model-status" id="sdpose-status"></p></section>
<section><h3>HaMeR · Hands</h3><div class="stage"><canvas id="hamer" aria-label="HaMeR hand overlay"></canvas></div><p class="model-status" id="hamer-status"></p></section>
</div>


<div class="layers" aria-label="Landmark layers">
<label><input type="checkbox" data-layer="body" checked> Body</label>
<label><input type="checkbox" data-layer="left" checked> Left hand</label>
<label><input type="checkbox" data-layer="right" checked> Right hand</label>
<label><input type="checkbox" data-layer="face" checked> Face</label>
<label><input type="checkbox" id="hamer-mesh" checked> HaMeR hand surface</label>
</div>
<p id="tracking-status" class="muted"></p>
<p id="status" class="muted" role="status"></p>
</article>
</main>
</body>
</html>
