name: SignaCulture AI CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  backend-and-schemas:
    name: Schemas, Backend & Experiments Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          else
            pip install pytest httpx uvicorn fastapi numpy
          fi

      - name: Run Schema Validation Tests
        run: python3 -m pytest backend/app/schemas -v

      - name: Run Backend Unit Tests
        run: python3 -m pytest backend/tests -v

      - name: Run Experiments Tests
        run: python3 -m pytest experiments/motion_extraction -v

      - name: Integration & Smoke Tests against live FastAPI
        run: |
          python3 -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          BACKEND_PID=$!
          sleep 3
          python3 scripts/smoke_test.py --base-url http://127.0.0.1:8000
          kill $BACKEND_PID

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (Strict npm ci)
        run: npm ci

      - name: Run Frontend Lint
        run: npm run lint

      - name: Run Frontend Build
        run: npm run build
