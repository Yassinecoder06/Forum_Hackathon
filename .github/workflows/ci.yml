name: SignaCulture AI CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  backend-and-schemas:
    name: Schemas, Backend & Experiments Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          else
            pip install pytest httpx uvicorn fastapi numpy
          fi

      - name: Run Schema Validation Tests
        run: python3 -m pytest backend/app/schemas -v

      - name: Run Backend Unit Tests
        run: python3 -m pytest backend/tests -v

      - name: Run Experiments Tests
        run: python3 -m pytest research/code/experiments/motion_extraction -v

      - name: Integration & Smoke Tests against live FastAPI
        run: |
          python3 -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          BACKEND_PID=$!
          sleep 3
          python3 scripts/smoke_test.py --base-url http://127.0.0.1:8000
          kill $BACKEND_PID

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (Strict npm ci)
        run: npm ci

      - name: Run motion and retargeting checks
        run: npm test

      - name: Run Frontend Lint
        run: npm run lint

      - name: Run Frontend Build
        run: npm run build

  browser-integration:
    name: Real browser and API integration
    runs-on: ubuntu-latest
    needs: [backend-and-schemas, frontend-check]
    steps:
      - uses: actions/checkout@v4
      - name: Install required media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install runtime and browser dependencies
        run: |
          python3 -m pip install -r backend/requirements.txt
          npm ci --prefix frontend
          npm ci --prefix e2e
          python3 scripts/setup-avatar.py
          cd e2e
          npx playwright install --with-deps chromium
      - name: Verify full application
        run: |
          python3 -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          (cd frontend && exec node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 --strictPort) &
          ui_pid=$!
          trap 'kill "$api_pid" "$ui_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health && curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          npm --prefix e2e test
